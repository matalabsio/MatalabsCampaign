<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MATA LABS — Kiriti Mortha</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="./Images/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./Images/apple-touch-icon.png" />
  <meta name="theme-color" content="#0B1B5C" />
  <meta name="description" content="Kiriti Mortha, Director of MATA Labs OPC. Communication design, strategy, education and initiatives." />

  <!-- Typography: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Confidential Presentation Access Gate -->
  <div id="auth-gate" class="auth-gate-container">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <img src="./Images/mata-logo-white.svg" alt="MATA LABS" class="auth-logo" />
      </div>
      <h2 class="auth-title">Kiriti Mortha</h2>
      <p class="auth-subtitle">Director Profile</p>

      <form id="auth-form" class="auth-form" autocomplete="off">
        <div class="auth-input-wrapper">
          <input
            type="password"
            id="auth-input"
            class="auth-input"
            placeholder="Enter access key"
            autocomplete="current-password"
            required
            autofocus
          />
          <button type="button" class="auth-visibility-btn" id="auth-visibility-btn" aria-label="Show password" aria-controls="auth-input" aria-pressed="false" title="Show password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
              <path class="auth-eye-slash" d="M3 3l18 18" />
            </svg>
          </button>
          <button type="submit" class="auth-submit-btn" id="auth-submit-btn" aria-label="Unlock Presentation">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
        <div id="auth-error" class="auth-error-msg">Incorrect access key. Please try again.</div>
      </form>

      <p class="auth-privacy">Usage analytics records visits, viewing time, link clicks, and IP addresses. No location is collected.</p>
      <div class="auth-footer-tag">MATA LABS POLCOMMS · PRIVILEGED ACCESS</div>
    </div>
  </div>


  <!-- Full-Page Presentation Container -->
  <main class="presentation-deck" id="presentation-deck">
    <!-- Slides rendered dynamically via app.js -->
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
